# ===============================
# CONFIGURACIÓN DEL SERVIDOR
# ===============================
spring.application.name=cursillo-ms-notas
server.port=8082

# ===============================
# BASE DE DATOS (SUPABASE)
# ===============================
spring.datasource.url=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.shyckraroqegoaxzdmrp
spring.datasource.password=Cursillo-12345678
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

# ===============================
# JPA & HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.enabled=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false 

# ===============================
# REDIS & CACHÉ
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis

app.cache.ttl.notas-categoria=3600
app.cache.ttl.notas-detalle=300
app.cache.ttl.notas-usuario=60
app.cache.ttl.notas-archivada=0

# ===============================
# EUREKA CLIENT (DESHABILITADO)
# ===============================
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ===============================
# LOGGING
# ===============================
logging.file.name=logs/notas.log
logging.level.org.cursillo.cursillomsfeaturea.controllers=INFO
logging.level.org.cursillo.cursillomsfeaturea.services=INFO
logging.level.org.cursillo.cursillomsfeaturea.repositories=DEBUG
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis=TRACE

# ===============================
# SEGURIDAD JWT
# ===============================
# Clave secreta compartida entre microservicios (debe tener al menos 32 caracteres)
app.security.jwt.secret=${JWT_SECRET:mi_clave_secreta_super_segura_compartida_123}